<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent traffic</title>
<style>
:root{--muted:#6b7280;--border:#e5e7eb;--soft:#f8fafc;--ink:#111827}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column;overflow:hidden}
pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
pre{margin:0;white-space:pre-wrap;word-break:break-word}
button{font:inherit}
/* top bar */
#top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);background:#fff}
#conn{display:flex;align-items:center;gap:5px;font-weight:600;min-width:110px}
.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;display:inline-block}
.dot.live{background:#16a34a}
#conn.re{color:#b45309}
#totals{display:flex;flex-wrap:wrap;gap:4px 12px;color:#374151}
#totals b{font-variant-numeric:tabular-nums}
#totals .err b{color:#dc2626}
#totals .terr b{color:#b45309}
#totals .sub{color:var(--muted)}
#controls{display:flex;gap:12px;align-items:center;margin-left:auto}
#controls label{display:flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
select{font:inherit;padding:1px 4px}
/* panes */
#main{flex:1;display:flex;min-height:0}
#left{width:38%;min-width:340px;border-right:1px solid var(--border);position:relative;display:flex;flex-direction:column}
#list{flex:1;overflow-y:auto;overflow-anchor:none}
#right{flex:1;overflow-y:auto;padding:10px 18px 80px;min-width:0;overflow-anchor:none}
#pill{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#2563eb;color:#fff;border:0;border-radius:999px;padding:3px 14px;cursor:pointer;display:none;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.2);font-weight:600}
.empty{color:var(--muted);padding:30px 10px;text-align:center}
/* rows */
.row{padding:5px 10px 5px 8px;border-bottom:1px solid #f1f5f9;border-left:4px solid transparent;cursor:pointer}
.row:hover{background:var(--soft)}
.row.sel{background:#eef2ff}
.row.dim{opacity:.55}
.row.dim.sel{opacity:.8}
.row.lv1{border-left-color:#dc2626}
.row.lv2{border-left-color:#f59e0b}
.row.lv3{border-left:4px dashed #f59e0b}
.l1,.l2{display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden;min-width:0}
.l2{color:var(--muted);margin-top:2px;font-size:12px}
.rid{font-weight:700;font-variant-numeric:tabular-nums;min-width:30px}
.time{color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:4px;padding:0 5px;font-size:11px;line-height:17px;font-weight:600;white-space:nowrap}
.thr{color:#fff;min-width:20px;text-align:center}
.thr.none{background:#e5e7eb;color:#6b7280}
.kind{color:#475569;background:#f1f5f9}
.badge{border-radius:4px;padding:0 6px;font-size:11px;line-height:17px;font-weight:700;color:#fff;white-space:nowrap}
.b-ok{background:#16a34a}.b-bad{background:#dc2626}.b-run{background:#2563eb;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.spin{width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.model{color:var(--muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
.dur{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.tchip{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-weight:600}
.terrchip{background:#fef3c7;color:#92400e;border:1px solid #f59e0b}
.warnchip{background:#fffbeb;color:#92400e;border:1px dashed #f59e0b}
.newn{color:#1d4ed8;font-weight:600;flex:none}
.snip{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto;color:#374151}
.errtxt{color:#dc2626}
.otok{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
/* detail */
.sumbox{border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:var(--soft);margin-bottom:10px}
.sumbox .line{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin:2px 0}
.sumbox .k{color:var(--muted)}
.sumbox b{font-variant-numeric:tabular-nums}
.warn{color:#92400e;background:#fffbeb;border:1px solid #fcd34d;border-radius:5px;padding:3px 8px;margin:4px 0;display:inline-block}
.errbox{color:#991b1b;background:#fef2f2;border:1px solid #fca5a5;border-left:4px solid #dc2626;border-radius:0 6px 6px 0;padding:6px 10px;margin:6px 0}
.errbox b{color:#b91c1c}
.cx-h{cursor:pointer;display:flex;gap:7px;align-items:center;user-select:none;min-width:0}
.caret{color:var(--muted);width:10px;flex:none;font-size:11px}
.panel{border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.panel>.cx-h{padding:7px 10px;background:var(--soft);font-weight:600}
.panel.open>.cx-h{border-bottom:1px solid var(--border)}
.panel>.cx-b{padding:6px 12px 10px}
.pbadge{font-weight:500;color:var(--muted);font-size:12px}
.dbadge{font-weight:600;font-size:12px;border-radius:4px;padding:0 6px}
.d-same{color:#475569;background:#f1f5f9}.d-chg{color:#92400e;background:#fef3c7}
.d-add{color:#166534}.d-del{color:#991b1b}.d-mod{color:#92400e}
/* messages and cards */
.msg{margin:10px 0}
.msg.r-assistant{margin-left:24px}
.mhead{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px;font-variant-numeric:tabular-nums}
.mhead .role-user{color:#1d4ed8}.mhead .role-assistant{color:#15803d}.mhead .role-system{color:#4b5563}
.card{border-left:4px solid #9ca3af;background:#fff;border-radius:0 6px 6px 0;padding:5px 10px 6px;margin:4px 0;min-width:0}
.clabel{font-size:10.5px;font-weight:800;letter-spacing:.06em;display:flex;gap:8px;align-items:center;margin-bottom:2px;min-width:0}
.clabel .nm{letter-spacing:0;font-size:11.5px}
.clabel .meta{margin-left:auto;font-weight:500;letter-spacing:0;color:var(--muted)}
.c-you{border-color:#2563eb;background:#eff6ff}.c-you>.clabel,.c-you>.cx-h .clabel{color:#1d4ed8}
.c-inj{border-color:#9ca3af;background:#f9fafb}.c-inj .clabel{color:#6b7280}
.c-sys{border-color:#6b7280;background:#f3f4f6}.c-sys .clabel{color:#4b5563}
.c-add{border-color:#6b7280;background:#fff}.c-add .clabel{color:#4b5563}
.c-model{border-color:#16a34a;background:#f0fdf4}.c-model>.clabel{color:#15803d}
.c-think{border-color:#9333ea;background:#faf5ff}.c-think>.clabel{color:#7e22ce}.c-think pre,.c-think .ttxt{font-style:italic;font-family:inherit;font-size:13px}
.c-call{border-color:#ea580c;background:#fff7ed}.c-call>.clabel{color:#c2410c}
.c-res{border-color:#0d9488;background:#f0fdfa}.c-res>.clabel{color:#0f766e}
.c-err{border-color:#dc2626;background:#fef2f2}.c-err>.clabel{color:#b91c1c}
.c-unk{border-color:#9ca3af;background:#fff}.c-unk>.clabel{color:#6b7280}
.card.hl{outline:1.5px solid #ea580c;outline-offset:1px}
.c-model pre,.c-you pre{font-family:inherit;font-size:13px}
.ic{font-size:12px;width:12px;text-align:center}
.oneline{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;font-weight:400;letter-spacing:0;color:var(--muted)}
.isum{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:rgba(255,255,255,.7);border:1px solid #fed7aa;border-radius:4px;padding:2px 6px;margin:2px 0;white-space:pre-wrap;word-break:break-all}
.idesc{color:var(--muted);margin:2px 0}
.attached{margin:6px 0 2px 12px}
.waiting{color:#92400e;font-style:italic;margin:6px 0 2px 12px;display:flex;gap:6px;align-items:center}
.stub{color:var(--muted);font-size:12px;padding:2px 8px;border-left:4px solid #99f6e4;margin:3px 0}
.lnk{background:none;border:0;color:#2563eb;cursor:pointer;padding:0;text-decoration:underline;font-size:12px}
.ltbar{display:flex;gap:12px;margin-top:3px}
.loaded{font-weight:600;color:#0f766e;margin:2px 0}
.group{border:1px dashed #cbd5e1;border-radius:6px;padding:3px 8px;margin:8px 0;color:var(--muted)}
.group>.cx-b{color:var(--ink)}
/* json tree */
.jt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.jrow{display:flex;gap:4px;align-items:flex-start;min-width:0}
.jrow>.lt{flex:1;min-width:0}
.jnode>.cx-b{padding-left:14px;border-left:1px dotted #d1d5db;margin-left:4px}
.jk{color:#6b7280;white-space:nowrap}
.js{color:#0f766e}.jn{color:#1d4ed8}.jb{color:#9333ea}.jnull{color:#9ca3af}
.jsum{color:#9ca3af}
.jhl{background:#fef08a;color:#713f12;border-radius:3px;padding:0 2px}
.jtitle{font-size:11px;font-weight:700;color:var(--muted);margin:6px 0 2px}
/* tools / headers / diff */
.tline .tname{font-weight:700;flex:none}
.tag{font-size:10.5px;border-radius:4px;padding:0 5px;background:#f1f5f9;color:#475569;flex:none}
.tag.cache{background:#e0f2fe;color:#075985}
.tag.new{background:#dcfce7;color:#166534}
.tag.mod{background:#fef3c7;color:#92400e}
.tline{padding:2px 0;border-bottom:1px solid #f3f4f6}
table.hd{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:8px}
table.hd td{border-bottom:1px solid #f3f4f6;padding:2px 6px;vertical-align:top;word-break:break-all}
table.hd td:first-child{color:var(--muted);white-space:nowrap;width:1%;word-break:normal}
.diff{border:1px solid var(--border);border-radius:6px;padding:4px;margin:6px 0;max-height:500px;overflow:auto}
.diff div{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word}
.dl-add{background:#dcfce7}.dl-del{background:#fee2e2}.dl-skip{color:#9ca3af;font-style:italic}
.sysblk{border-left:3px solid #d1d5db;padding-left:8px;margin:6px 0}
</style>
</head>
<body>
<div id="top">
  <div id="conn" class="re"><span class="dot" id="dot"></span><span id="connText">connecting…</span></div>
  <div id="totals"></div>
  <div id="controls">
    <select id="toolSel" title="Show only exchanges involving this tool"><option value="">all tools</option></select>
    <label><input type="checkbox" id="errOnly"> Errors only</label>
    <label><input type="checkbox" id="hideSide"> Hide side calls</label>
    <label><input type="checkbox" id="follow" checked> Follow newest</label>
  </div>
</div>
<div id="main">
  <div id="left">
    <button id="pill" type="button"></button>
    <div id="list"></div>
  </div>
  <div id="right"></div>
</div>
<script>
'use strict';
// All data goes into the page through textContent / createElement. Never innerHTML.

// ------------------------------------------------------------------ helpers
const $ = (id) => document.getElementById(id);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, String(v));
  }
  add(el, kids);
  return el;
}
function add(el, kids) {
  for (const c of kids) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) add(el, c);
    else if (c instanceof Node) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
}
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
const pad2 = (n) => String(n).padStart(2, '0');
function fmtTime(t) { const d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
function fmtDur(ms) { if (ms == null || !isFinite(ms)) return '–'; if (ms < 1000) return Math.round(ms) + 'ms'; if (ms < 60000) return (ms / 1000).toFixed(1) + 's'; return Math.floor(ms / 60000) + 'm' + pad2(Math.round(ms % 60000 / 1000)) + 's'; }
function fmtK(n) { n = n || 0; if (n < 1000) return String(n); if (n < 1e6) return (n / 1000).toFixed(n < 10000 ? 1 : 0) + 'k'; return (n / 1e6).toFixed(2) + 'M'; }
const fmtN = (n) => (n || 0).toLocaleString('en-US');
function sortKeys(v) {
  if (Array.isArray(v)) return v.map(sortKeys);
  if (isObj(v)) { const o = {}; for (const k of Object.keys(v).sort()) { if (k === 'cache_control') continue; o[k] = sortKeys(v[k]); } return o; }
  return v;
}
const stable = (v) => v === undefined ? '\u0000undef' : JSON.stringify(sortKeys(v));
function normMsg(m) {
  if (!isObj(m)) return stable(m);
  const c = typeof m.content === 'string' ? [{ type: 'text', text: m.content }] : m.content;
  return stable(Object.assign({}, m, { content: c }));
}
function getHeader(pairs, name) {
  name = name.toLowerCase();
  for (const p of pairs || []) if (String(p[0]).toLowerCase() === name) return p[1];
  return null;
}
function blocksOf(content) {
  if (typeof content === 'string') return [{ type: 'text', text: content }];
  if (Array.isArray(content)) return content;
  if (content == null) return [];
  return [content];
}
function sysBlocks(b) {
  const s = b && b.system;
  if (typeof s === 'string') return [{ type: 'text', text: s }];
  if (Array.isArray(s)) return s;
  return [];
}
const blockText = (x) => typeof x === 'string' ? x : (isObj(x) && typeof x.text === 'string') ? x.text : JSON.stringify(x);
const lineCount = (s) => { let n = 1; for (let i = s.indexOf('\n'); i >= 0; i = s.indexOf('\n', i + 1)) n++; return n; };
function copyText(s, btn) {
  const done = () => { btn.textContent = 'copied'; setTimeout(() => { btn.textContent = 'copy'; }, 1200); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(s).then(done, () => fallbackCopy(s, done));
  else fallbackCopy(s, done);
}
function fallbackCopy(s, done) {
  const ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0' }); ta.value = s;
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
  ta.remove();
}
function letters(n) { let s = ''; n++; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; }

// ------------------------------------------------------------------ state
const PALETTE = ['#2563eb', '#0d9488', '#d97706', '#db2777']; // blue, teal, amber, pink
const SLATE = '#64748b';
const PARAMS = ['model', 'max_tokens', 'thinking', 'output_config', 'context_management'];
const UI = { tool: '', errorsOnly: false, hideSide: false, follow: true };
let S;            // everything rebuilt on `reset`
let selected = null;   // user's selection (exchange id), kept across reconnects
let newCount = 0;
function fresh() {
  S = { ex: new Map(), threads: new Map(), mainSeq: 0, sideSeq: 0, tools: new Map(), toolNames: new Set(), newestMain: null };
}
fresh();
function tent(id) {
  let e = S.tools.get(id);
  if (!e) { e = { name: null, input: undefined, callExchangeId: null, resultExchangeId: null, resultBlock: null }; S.tools.set(id, e); }
  return e;
}
function addToolName(n) { if (n && !S.toolNames.has(n)) { S.toolNames.add(n); dirty.filterOpts = true; } }

// ------------------------------------------------------------------ classify / threads
function classify(req, b) {
  if (req.method !== 'POST' || !String(req.path || '').startsWith('/v1/messages')) return { kind: 'probe', label: 'probe' };
  if (b && b.max_tokens === 1) return { kind: 'probe', label: 'probe: quota' };
  if (!b || !Array.isArray(b.tools) || b.tools.length === 0) {
    let name = null;
    const props = b && b.output_config && b.output_config.format && b.output_config.format.schema && b.output_config.format.schema.properties;
    if (isObj(props)) name = Object.keys(props)[0] || null;
    return { kind: 'side', label: name ? 'side: ' + name : 'side' };
  }
  return { kind: 'main', label: '' };
}
function threadFor(ex) {
  const sid = getHeader(ex.req.headers, 'x-claude-code-session-id') || '';
  const sb = sysBlocks(ex.b);
  const sysLast = sb.length ? blockText(sb[sb.length - 1]) : '';
  let fu = '';
  if (ex.msgs) { const m = ex.msgs.find((x) => isObj(x) && x.role === 'user'); if (m) fu = normMsg(m); }
  else if (!ex.b && ex.req.body) fu = String(ex.req.body);
  const key = sid + '\u0001' + sysLast.slice(0, 300) + '\u0001' + fu.slice(0, 300);
  let t = S.threads.get(key);
  if (!t) {
    // Main threads are lettered A, B, C… in order of first appearance; side
    // threads (title calls, probes with a body) get s1, s2… in slate, so the
    // real session is always thread A even though its side calls come first.
    if (ex.kind === 'main') { t = { key, name: letters(S.mainSeq), color: PALETTE[S.mainSeq % PALETTE.length], main: true }; S.mainSeq++; }
    else { S.sideSeq++; t = { key, name: 's' + S.sideSeq, color: SLATE, main: false }; }
    t.lastReq = null;
    S.threads.set(key, t);
  } else if (ex.kind === 'main' && !t.main) {
    t.main = true; t.name = letters(S.mainSeq); t.color = PALETTE[S.mainSeq % PALETTE.length]; S.mainSeq++;
    for (const o of S.ex.values()) if (o.thread === t) dirty.rows.add(o.id);
  }
  return t;
}

// ------------------------------------------------------------------ requests
function onRequest(ev) {
  if (S.ex.has(ev.id)) return;
  const b = isObj(ev.body_json) ? ev.body_json : null;
  const ex = {
    id: ev.id, req: ev, b, start: null, end: null, text: '', rp: newReply(), firstChunkT: null,
    msgs: b && Array.isArray(b.messages) ? b.messages : null, norm: null, prev: null,
    newStart: 0, collapsed: 0, histChanged: false, newResultIds: [], toolErrIds: [],
    level: 0, errReason: null, thread: null, row: null,
    sysChanged: null, toolsDiff: null, paramChanged: null, topChanged: new Set(),
  };
  Object.assign(ex, classify(ev, b));
  S.ex.set(ex.id, ex);
  const hasBody = ev.body_json != null || (ev.body != null && ev.body !== '');
  if (!(ex.kind === 'probe' && !hasBody)) ex.thread = threadFor(ex);
  const resolved = [];
  if (ex.msgs) {
    ex.norm = ex.msgs.map(normMsg);
    const prev = ex.thread && ex.thread.lastReq != null ? S.ex.get(ex.thread.lastReq) : null;
    if (prev && prev.norm) {
      ex.prev = prev.id;
      let L = 0; const n = Math.min(prev.norm.length, ex.norm.length);
      while (L < n && prev.norm[L] === ex.norm[L]) L++;
      ex.newStart = L; ex.collapsed = L; ex.histChanged = L < prev.norm.length;
      computeDiffs(ex, prev);
    } else {
      let i = -1;
      for (let k = ex.msgs.length - 1; k >= 0; k--) if (isObj(ex.msgs[k]) && ex.msgs[k].role === 'user') { i = k; break; }
      if (i < 0) i = 0;
      if (i > 0 && isObj(ex.msgs[i - 1]) && ex.msgs[i - 1].role === 'system') i--;
      ex.newStart = i; ex.collapsed = 0;
    }
    if (ex.thread) ex.thread.lastReq = ex.id;
    indexRequest(ex, resolved);
  }
  if (ex.kind === 'main' && (S.newestMain == null || ex.id > S.newestMain)) S.newestMain = ex.id;
  computeLevel(ex);
  insertRow(ex);
  // A waiting tool call on screen just got its result: update it in place.
  if (resolved.some((id) => displayed.has(id))) dirty.detail = 'all';
  if (ex.kind === 'main' && UI.follow && $('list').scrollTop <= 4) select(ex.id, false);
  dirty.totals = true;
  schedule();
}
function indexRequest(ex, resolved) {
  ex.msgs.forEach((m, mi) => {
    if (!isObj(m) || !Array.isArray(m.content)) return;
    for (const b of m.content) {
      if (!isObj(b)) continue;
      if (b.type === 'tool_use' && b.id) {
        const e = tent(b.id);
        if (!e.name) e.name = b.name;
        if (e.input === undefined) e.input = b.input;
        addToolName(b.name);
      } else if (b.type === 'tool_result' && b.tool_use_id) {
        const e = tent(b.tool_use_id);
        if (mi >= ex.newStart) ex.newResultIds.push(b.tool_use_id);
        if (e.resultExchangeId == null) {
          e.resultExchangeId = ex.id; e.resultBlock = b; resolved.push(b.tool_use_id);
          if (b.is_error) ex.toolErrIds.push(b.tool_use_id);
        }
      }
    }
  });
}
function toolKey(t) { return isObj(t) ? String(t.name || t.type || '?') : String(t); }
function computeDiffs(ex, prev) {
  const a = prev.b || {}, b = ex.b || {};
  ex.sysChanged = stable(sysBlocks(a)) !== stable(sysBlocks(b));

  $('dot').classList.toggle('live', live);
  $('conn').classList.toggle('re', !live);
  $('connText').textContent = live ? 'live' : 'reconnecting…';
}
let es = null;
function connect() {
  es = new EventSource('/__events');
  es.onopen = () => setLive(true);
  es.onerror = () => {
    setLive(false);
    if (es.readyState === EventSource.CLOSED) { es.close(); setTimeout(connect, 2000); }
  };
  es.onmessage = (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch (err) { return; }
    try { handle(ev); } catch (err) { console.error('dashboard: could not handle event', ev && ev.type, err); }
  };
}

// ------------------------------------------------------------------ controls
$('toolSel').addEventListener('change', (e) => { UI.tool = e.target.value; applyFilters(); });
$('errOnly').addEventListener('change', (e) => { UI.errorsOnly = e.target.checked; applyFilters(); });
$('hideSide').addEventListener('change', (e) => { UI.hideSide = e.target.checked; applyFilters(); });
$('follow').addEventListener('change', (e) => {
  UI.follow = e.target.checked;
  if (UI.follow) { $('list').scrollTop = 0; newCount = 0; updatePill(); select(S.newestMain, false); }
});
$('pill').addEventListener('click', () => { $('list').scrollTo({ top: 0, behavior: 'smooth' }); newCount = 0; updatePill(); });
$('list').addEventListener('scroll', () => { if ($('list').scrollTop <= 4 && newCount) { newCount = 0; updatePill(); } });

resetAll();
connect();
</script>
</body>
