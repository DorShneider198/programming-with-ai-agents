<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent traffic</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e5e7eb; --text: #111827; --muted: #6b7280; --faint: #9ca3af;
    --red: #dc2626; --red-bg: #fef2f2; --amber: #d97706; --amber-bg: #fffbeb; --green: #16a34a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg);
         display: flex; flex-direction: column; }
  button { font: inherit; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }

  /* ---- top bar ---- */
  #top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
         padding: 8px 14px; background: #111827; color: #e5e7eb; }
  #top .brand { font-weight: 600; color: #fff; }
  #live { display: inline-flex; align-items: center; gap: 6px; }
  #live .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; }
  #live.on .dot { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.25); }
  #live.off .dot { background: #f59e0b; animation: pulse 1s infinite; }
  #totals { display: flex; gap: 12px; flex-wrap: wrap; }
  #totals .t b { color: #fff; font-variant-numeric: tabular-nums; }
  #totals .t.err b { color: #f87171; }
  #totals .t.terr b { color: #fbbf24; }
  #totals .t span { color: #9ca3af; }
  #top .ctl { display: flex; gap: 12px; align-items: center; margin-left: auto; }
  #top label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; user-select: none; }
  #top select { font: inherit; padding: 1px 4px; border-radius: 4px; }

  /* ---- panes ---- */
  main { flex: 1; display: flex; min-height: 0; }
  #listPane { width: 38%; min-width: 320px; overflow-y: auto; overflow-anchor: none; border-right: 1px solid var(--line);
              background: var(--panel); position: relative; }
  #detail { flex: 1; overflow-y: auto; padding: 12px 16px 60px; min-width: 0; }
  #newPill { position: sticky; top: 8px; z-index: 3; display: block; margin: 0 auto -30px; height: 30px; padding: 0 14px;
             border: 0; border-radius: 15px; background: #2563eb; color: #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .emptylist { padding: 24px; color: var(--muted); }

  /* ---- rows ---- */
  .row { padding: 5px 10px 5px 8px; border-left: 4px solid transparent; border-bottom: 1px solid #f0f1f3; cursor: pointer;
         white-space: nowrap; overflow: hidden; }
  .row:hover { background: #f9fafb; }
  .row.sel { background: #eef2ff; }
  .row.dim { opacity: .55; }
  .row.dim.sel { opacity: .8; }
  .row.lv-error { border-left-color: var(--red); }
  .row.lv-toolerr { border-left-color: var(--amber); }
  .row.lv-warn { border-left: 4px dotted var(--amber); }
  .row .l1, .row .l2 { display: flex; align-items: center; gap: 6px; overflow: hidden; height: 20px; }
  .row .l2 { color: var(--muted); font-size: 12px; }
  .row .id { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 34px; }
  .row .time, .row .dur { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .model { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .row .dur { margin-left: auto; }
  .row .snip { overflow: hidden; text-overflow: ellipsis; color: #374151; }
  .row .out { margin-left: auto; padding-left: 6px; font-variant-numeric: tabular-nums; }
  .kindlbl { font-size: 11px; padding: 0 5px; border-radius: 3px; background: #f3f4f6; color: #4b5563; }
  .tchip { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
           border-radius: 4px; color: #fff; font-size: 11px; font-weight: 700; }
  .tchip.none { background: #d1d5db; color: #4b5563; }
  .tchip.side { opacity: .8; }
  .badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px;
           font-weight: 600; font-variant-numeric: tabular-nums; }
  .badge.ok { background: #dcfce7; color: #166534; }
  .badge.bad { background: #fee2e2; color: #991b1b; }
  .badge.stream { background: #dbeafe; color: #1e40af; animation: pulse 1.1s ease-in-out infinite; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #c7d2fe; border-top-color: #2563eb;
          border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
  .toolchip { font-size: 11px; padding: 0 5px; border-radius: 3px; background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
  .terrchip { font-size: 11px; padding: 0 5px; border-radius: 3px; background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; font-weight: 600; }
  .warnchip { font-size: 11px; padding: 0 5px; border-radius: 3px; color: #92400e; border: 1px dashed #f59e0b; }
  .errchip { font-size: 11px; padding: 0 5px; border-radius: 3px; background: #fee2e2; color: #991b1b; font-weight: 600; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .45; } }

  /* ---- detail ---- */
  .empty { color: var(--muted); padding: 30px 10px; }
  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .summary .s1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .summary .s1 .big { font-weight: 700; font-size: 15px; }
  .summary .s2 { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; color: #374151; font-variant-numeric: tabular-nums; }
  .summary .s2 .k { color: var(--muted); }
  .warnline { margin-top: 6px; padding: 4px 8px; border-radius: 4px; background: var(--amber-bg); color: #92400e; border: 1px solid #fde68a; }
  .errline { margin-top: 6px; padding: 4px 8px; border-radius: 4px; background: var(--red-bg); color: #991b1b; border: 1px solid #fecaca; }

  .sec { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
  .sec-head { display: flex; gap: 8px; align-items: center; padding: 7px 12px; cursor: pointer; user-select: none; flex-wrap: wrap; }
  .sec-head:hover { background: #f9fafb; border-radius: 8px; }
  .sec-title { font-weight: 600; }
  .sec-body { padding: 4px 12px 12px; border-top: 1px solid #f0f1f3; }
  .tw { display: inline-block; width: 12px; color: var(--muted); }
  .hbadge { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #f3f4f6; color: #374151; }
  .hbadge.chg { background: #fef3c7; color: #92400e; }
  .hbadge.add { background: #dcfce7; color: #166534; }
  .hbadge.del { background: #fee2e2; color: #991b1b; }
  .hbadge.err { background: #fee2e2; color: #991b1b; }

  /* message wrappers */
  .msg { margin: 10px 0; }
  .msg.assistant { margin-left: 24px; }
  .msg-head { font-size: 11px; color: var(--muted); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .msg-head b { color: #374151; }
  .group-toggle { display: block; width: 100%; text-align: left; border: 1px dashed #d1d5db; background: #fafafa; color: #4b5563;
                  border-radius: 6px; padding: 6px 10px; margin: 8px 0; cursor: pointer; }
  .group-toggle:hover { background: #f3f4f6; }

  /* cards: the colored bar + label scheme from the spec */
  .card { border-left: 4px solid var(--bar); background: var(--bg2); border-radius: 0 6px 6px 0; margin: 4px 0; padding: 5px 10px 7px; }
  .card.hl { outline: 1.5px solid #111827; outline-offset: 1px; }
  .card-head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .card-head.clickable { cursor: pointer; }
  .card .icon { color: var(--bar); font-size: 12px; width: 14px; text-align: center; flex: none; }
  .card .label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--bar); flex: none; }
  .card .meta { margin-left: auto; font-size: 11px; color: var(--muted); flex: none; padding-left: 8px; }
  .card .preview { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; font-size: 12px; }
  .card-body { margin-top: 3px; }
  .k-you     { --bar: #2563eb; --bg2: #eff6ff; }
  .k-inject  { --bar: #9ca3af; --bg2: #f9fafb; }
  .k-sysmsg  { --bar: #6b7280; --bg2: #f3f4f6; }
  .k-added   { --bar: #6b7280; --bg2: #f9fafb; }
  .k-model   { --bar: #16a34a; --bg2: #f0fdf4; }
  .k-think   { --bar: #9333ea; --bg2: #faf5ff; }
  .k-think .txt { font-style: italic; }
  .k-call    { --bar: #ea580c; --bg2: #fff7ed; }
  .k-result  { --bar: #0d9488; --bg2: #f0fdfa; }
  .k-error   { --bar: #dc2626; --bg2: #fef2f2; }
  .k-unknown { --bar: #9ca3af; --bg2: #f9fafb; }
  .k-inject .card-body, .k-sysmsg .card-body { color: #4b5563; }
  .callgroup { margin: 4px 0 8px; }
  .slot { margin-left: 18px; }
  .slot .card { margin-top: 2px; }
  .waiting { margin: 2px 0 0 18px; padding: 4px 10px; border-left: 4px dashed #99f6e4; color: #0f766e; font-style: italic; background: #f8fffe; }
  .stub { color: var(--muted); font-size: 12px; padding: 2px 10px; border-left: 4px solid #ccfbf1; margin: 3px 0; }
  .call-sum { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; color: #7c2d12; }
  .call-desc { color: var(--muted); font-size: 12px; }
  .sublabel { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
  .loaded { font-size: 11px; font-weight: 700; letter-spacing: .05em; color: #0f766e; padding: 3px 0; }
  .loaded span { font-family: var(--mono); font-weight: 600; letter-spacing: 0; }
  .rlink { font-size: 11px; color: #2563eb; cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; }

  /* long text */
  .lt { position: relative; }
  .txt { white-space: pre-wrap; word-break: break-word; }
  .txt.mono { font-family: var(--mono); font-size: 12px; }
  .lt-tools { display: flex; gap: 10px; margin-top: 2px; }
  .link { background: none; border: 0; padding: 0; color: #2563eb; cursor: pointer; font-size: 11.5px; }
  .link:hover { text-decoration: underline; }

  /* JSON tree */
  .jt { font-family: var(--mono); font-size: 12px; line-height: 1.5; }
  .jkids { padding-left: 16px; border-left: 1px dotted #e5e7eb; margin-left: 5px; }
  .jh { cursor: pointer; }
  .jh:hover { background: #f3f4f6; }
  .jk { color: #6b7280; }
  .js { color: #047857; white-space: pre-wrap; word-break: break-word; }
  .jnum { color: #1d4ed8; }
  .jbool { color: #9333ea; }
  .jnull { color: #9ca3af; }
  .jsum { color: #9ca3af; }
  .jchg { background: #fef3c7; border-radius: 3px; }

  /* system / tools / headers */
  .sysblk { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; }
  .sysblk-head { display: flex; gap: 8px; align-items: center; padding: 5px 10px; background: #f9fafb; cursor: pointer; border-radius: 6px 6px 0 0; }
  .sysblk-body { padding: 6px 10px; }
  .tag { font-size: 10.5px; padding: 0 5px; border-radius: 3px; background: #e0e7ff; color: #3730a3; }
  .tag.def { background: #f3e8ff; color: #6b21a8; }
  .tag.new { background: #dcfce7; color: #166534; }
  .tool-line { display: flex; gap: 8px; align-items: baseline; padding: 3px 4px; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
  .tool-line:hover { background: #f9fafb; }
  .tool-line .nm { font-family: var(--mono); font-weight: 600; flex: none; }
  .tool-line .d1 { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-detail { padding: 6px 4px 10px 20px; border-bottom: 1px solid #f3f4f6; }
  table.hdrs { border-collapse: collapse; width: 100%; font-size: 12px; margin-bottom: 10px; }
  table.hdrs td { border-bottom: 1px solid #f3f4f6; padding: 2px 6px; vertical-align: top; }
  table.hdrs td:first-child { font-family: var(--mono); color: var(--muted); white-space: nowrap; width: 1%; }
  table.hdrs td:last-child { font-family: var(--mono); word-break: break-all; }
  h4 { margin: 10px 0 4px; font-size: 12px; color: #374151; }
  .diff { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line); border-radius: 6px; padding: 6px; margin: 6px 0; max-height: 420px; overflow: auto; }
  .diff .a { background: #dcfce7; } .diff .d { background: #fee2e2; } .diff .c { color: #6b7280; } .diff .gap { color: #9ca3af; font-style: italic; }
  .errbox { border-left: 4px solid var(--red); background: var(--red-bg); color: #991b1b; padding: 6px 10px; border-radius: 0 6px 6px 0; margin: 6px 0; }
  .errbox b { font-family: var(--mono); }
  .note { color: var(--muted); font-style: italic; margin: 6px 0; }
</style>
</head>
<body>
<header id="top">
  <span class="brand">Agent traffic</span>
  <span id="live" class="off"><span class="dot"></span><span id="liveText">connecting…</span></span>
  <span id="totals"></span>
  <span class="ctl">
    <label>Tool <select id="toolFilter"><option value="">all tools</option></select></label>
    <label><input type="checkbox" id="errorsOnly"> Errors only</label>
    <label><input type="checkbox" id="hideSide"> Hide side calls</label>
    <label><input type="checkbox" id="follow" checked> Follow newest</label>
  </span>
</header>
<main>
  <section id="listPane">
    <button id="newPill" hidden></button>
    <div id="list"></div>
    <div id="emptyList" class="emptylist">No traffic yet. Run the agent with <code>ANTHROPIC_BASE_URL=http://localhost:8041 claude</code>, or start the proxy with <code>--demo</code>.</div>
  </section>
  <section id="detail"></section>
</main>
<script>
'use strict';
// All data goes into the page through textContent / createElement. Never innerHTML with data.

const $ = (id) => document.getElementById(id);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}
const PALETTE = ['#2563eb', '#0d9488', '#d97706', '#db2777', '#475569'];  // blue, teal, amber, pink, slate
const PARAM_KEYS = ['model', 'max_tokens', 'thinking', 'output_config', 'context_management'];
const fmtN = (n) => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('en-US');
const fmtDur = (ms) => ms == null ? '…' : ms < 1000 ? Math.round(ms) + 'ms' : (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + 's';
const fmtTime = (t) => { const d = new Date(t); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':'); };
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
const letterFor = (i) => i < 26 ? String.fromCharCode(65 + i) : String.fromCharCode(64 + Math.floor(i / 26)) + String.fromCharCode(65 + i % 26);

// ---------- normalization (5.2) ----------
function stable(v) {  // JSON.stringify with sorted keys and every cache_control removed
  if (v === null || typeof v !== 'object') { const s = JSON.stringify(v); return s === undefined ? 'null' : s; }
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).filter(k => k !== 'cache_control' && v[k] !== undefined).sort()
    .map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
}
const normContent = (c) => typeof c === 'string' ? [{ type: 'text', text: c }] : c;
const normMsg = (m) => isObj(m) ? stable(Object.assign({}, m, { content: normContent(m.content) })) : stable(m);
function systemBlocks(sys) {
  if (typeof sys === 'string') return [{ type: 'text', text: sys }];
  if (Array.isArray(sys)) return sys.map(b => typeof b === 'string' ? { type: 'text', text: b } : (b || {}));
  return [];
}
const blocksOf = (m) => !isObj(m) ? [] : Array.isArray(m.content) ? m.content : typeof m.content === 'string' ? [{ type: 'text', text: m.content }] : m.content == null ? [] : [m.content];
const hdr = (list, name) => { name = name.toLowerCase(); for (const [k, v] of list || []) if (String(k).toLowerCase() === name) return v; return null; };
const isReminder = (t) => typeof t === 'string' && t.trimStart().startsWith('<system-reminder>');

// ---------- state ----------
let S;
function freshState() {
  S = { ex: new Map(), order: [], threads: new Map(), nextLetter: 0, sessionLetter: new Map(),
        tools: new Map(), toolNames: new Set() };
}
freshState();
const UI = { selectedId: null, displayedId: null, newCount: 0, dirtyRows: new Set(), dirtyEx: new Set(),
             slotIds: new Set(), detailDirty: true, totalsDirty: true, toolsDirty: true, raf: false, slots: [] };
const F = { tool: '', errorsOnly: false, hideSide: false, follow: true };

function toolEntry(id) {
  let e = S.tools.get(id);
  if (!e) { e = { name: null, input: undefined, callExchangeId: null, resultExchangeId: null, resultBlock: null }; S.tools.set(id, e); }
  return e;
}
function addToolName(n) { if (n && !S.toolNames.has(n)) { S.toolNames.add(n); UI.toolsDirty = true; } }

// ---------- classification (5.1) ----------
function classify(ex) {
  const b = ex.body;
  if (ex.method !== 'POST' || !ex.path.startsWith('/v1/messages')) return ['probe', 'probe'];
  if (b && b.max_tokens === 1) return ['probe', 'probe: quota'];
  if (!b || !Array.isArray(b.tools) || b.tools.length === 0) {
    const props = b && b.output_config && b.output_config.format && b.output_config.format.schema && b.output_config.format.schema.properties;
    const name = isObj(props) ? Object.keys(props)[0] : null;
    return ['side', name ? 'side: ' + name : 'side'];
  }
  return ['main', ''];
}

// ---------- events ----------
function onRequest(ev) {
  const b = isObj(ev.body_json) ? ev.body_json : null;
  const ex = {
    id: ev.id, t0: ev.t, method: ev.method || '', path: ev.path || '', headers: ev.headers || [],
    body: b, bodyAny: ev.body_json, bodyText: ev.body, start: null, end: null, raw: '',
    sse: null, sseBuf: '', evName: null, dataLines: [],
    reply: { msgId: null, model: null, usage: {}, stop: null, blocks: [], complete: false, error: null,
             text: null, json: null, warnings: [] },
    ver: 0, toolErrorIds: [], newResultIds: [], thread: null, rowEl: null,
  };
  [ex.kind, ex.label] = classify(ex);
  ex.session = hdr(ex.headers, 'x-claude-code-session-id') || '';
  const msgs = b && Array.isArray(b.messages) ? b.messages : [];
  ex.msgs = msgs;
  ex.norm = msgs.map(normMsg);

  // thread
  if (!(ex.kind === 'probe' && !b)) {
    const sys = systemBlocks(b && b.system);
    const lastSys = sys.length ? String(sys[sys.length - 1].text || '') : '';
    const fu = msgs.findIndex(m => isObj(m) && m.role === 'user');
    const key = ex.session + '\u0001' + lastSys.slice(0, 300) + '\u0001' + (fu >= 0 ? ex.norm[fu] : '').slice(0, 300);
    let th = S.threads.get(key);
    if (!th) { th = { key, session: ex.session, letter: null, color: null, ids: [] }; S.threads.set(key, th); }
    if (ex.kind === 'main' && !th.letter) {
      // Letters go to main threads in order of first appearance; side calls show their session's main letter.
      const i = S.nextLetter++;
      th.letter = letterFor(i); th.color = PALETTE[i % PALETTE.length];
      if (!S.sessionLetter.has(ex.session)) { S.sessionLetter.set(ex.session, th); for (const e of S.ex.values()) UI.dirtyRows.add(e.id); }
    }
    ex.thread = th;
    const prev = th.ids.length ? S.ex.get(th.ids[th.ids.length - 1]) : null;
    th.ids.push(ex.id);
    computeDiff(ex, prev);
  } else {
    ex.diff = { prevId: null, newStart: msgs.length, L: 0 };
  }

  // tool index (5.4)
  msgs.forEach((m, mi) => {
    for (const blk of blocksOf(m)) {
      if (!isObj(blk)) continue;
      if (blk.type === 'tool_use' && blk.id) {
        const e = toolEntry(blk.id);
        if (!e.name) e.name = blk.name;
        if (e.input === undefined) e.input = blk.input;
        addToolName(blk.name);
      } else if (blk.type === 'tool_result' && blk.tool_use_id) {
        const e = toolEntry(blk.tool_use_id);
        if (e.resultExchangeId == null) {
          e.resultExchangeId = ex.id; e.resultBlock = blk;
          if (blk.is_error) ex.toolErrorIds.push(blk.tool_use_id);
          UI.slotIds.add(blk.tool_use_id);
          if (e.callExchangeId != null) UI.dirtyEx.add(e.callExchangeId);
        }

  }
  const el = h('div', { class: 'diff' });
  const line = (cls, pre, t) => el.append(h('div', { class: cls, text: pre + t }));
  if (p > 3) el.append(h('div', { class: 'gap', text: `… ${p - 3} unchanged lines` }));
  for (let i = Math.max(0, p - 3); i < p; i++) line('c', '  ', A[i]);
  for (const [k, t] of ops) line(k, k === 'a' ? '+ ' : k === 'd' ? '- ' : '  ', t);
  for (let i = B.length - s; i < Math.min(B.length, B.length - s + 3); i++) line('c', '  ', B[i]);
  if (s > 3) el.append(h('div', { class: 'gap', text: `… ${s - 3} unchanged lines` }));
  if (!ops.length) el.append(h('div', { class: 'gap', text: 'no line differences (whitespace or cache_control only)' }));
  return el;
}

// ---------- connection ----------
function handle(ev) {
  switch (ev.type) {
    case 'reset':
      freshState();
      list.replaceChildren(); $('emptyList').hidden = false;
      UI.newCount = 0; updatePill(); UI.slots = []; UI.displayedId = null;
      UI.detailDirty = true; UI.totalsDirty = true; UI.toolsDirty = true; UI.dirtyRows.clear();
      schedule(); break;
    case 'request': onRequest(ev); break;
    case 'response_start': onStart(ev); break;
    case 'response_chunk': onChunk(ev); break;
    case 'response_end': onEnd(ev); break;
  }
}
function setLive(on) {
  $('live').className = on ? 'on' : 'off';
  $('liveText').textContent = on ? 'live' : 'reconnecting…';
}
let es = null;
function connect() {
  es = new EventSource('/__events');
  es.onopen = () => setLive(true);
  es.onerror = () => {
    setLive(false);
    if (es.readyState === EventSource.CLOSED) { es = null; setTimeout(connect, 2000); }  // the browser gave up: retry ourselves
  };
  es.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch (_) { return; }
    try { handle(ev); } catch (err) { console.error('event failed', ev && ev.type, err); }
  };
}

// ---------- controls ----------
$('toolFilter').addEventListener('change', (e) => { F.tool = e.target.value; refilter(); });
$('errorsOnly').addEventListener('change', (e) => { F.errorsOnly = e.target.checked; refilter(); });
$('hideSide').addEventListener('change', (e) => { F.hideSide = e.target.checked; refilter(); });
$('follow').addEventListener('change', (e) => setFollow(e.target.checked));
$('newPill').addEventListener('click', () => { listPane.scrollTop = 0; });
listPane.addEventListener('scroll', () => { if (listAtTop() && UI.newCount) { UI.newCount = 0; updatePill(); } });
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,select,textarea') || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'j' && e.key !== 'k')) return;
  const rows = [...list.children].filter(r => !r.hidden);
  if (!rows.length) return;
  let i = rows.findIndex(r => Number(r.dataset.id) === UI.displayedId);
  i = (e.key === 'ArrowDown' || e.key === 'j') ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1);
  e.preventDefault(); setFollow(false); select(Number(rows[i].dataset.id)); rows[i].scrollIntoView({ block: 'nearest' });
});

connect();
schedule();
</script>
