<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent traffic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --you: #2563eb; --you-bg: #eff6ff;
  --inj: #9ca3af; --inj-bg: #f9fafb;
  --sys: #6b7280; --sys-bg: #f3f4f6;
  --model: #16a34a; --model-bg: #f0fdf4;
  --think: #9333ea; --think-bg: #faf5ff;
  --call: #ea580c; --call-bg: #fff7ed;
  --res: #0d9488; --res-bg: #f0fdfa;
  --rerr: #dc2626; --rerr-bg: #fef2f2;
  --unk: #9ca3af;
  --line: #e5e7eb; --muted: #6b7280; --text: #111827;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text); background: #f8fafc; display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }

/* ---- top bar ---- */
header#top { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line); padding: 6px 12px 6px; }
.bar1 { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-weight: 700; }
#live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
#live .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; }
#live.on .dot { background: #16a34a; box-shadow: 0 0 0 3px #dcfce7; }
#live.off .dot { animation: pulse 1s infinite; }
#totals { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; }
#totals .t b { font-variant-numeric: tabular-nums; }
#totals .t.err b { color: #dc2626; }
#totals .t.terr b { color: #b45309; }
.controls { display: flex; gap: 12px; align-items: center; margin-left: auto; font-size: 12px; }
.controls label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; user-select: none; }
.controls select { font: inherit; padding: 1px 4px; }
#chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
#chips:empty { display: none; }
.tchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--c); border-left-width: 5px; background: #fff;
  border-radius: 12px; padding: 1px 9px 1px 6px; font-size: 12px; cursor: pointer; max-width: 380px; }
.tchip .lt { font-weight: 700; color: var(--c); }
.tchip .pr { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tchip .cnt { color: var(--muted); font-variant-numeric: tabular-nums; }
.tchip.on { background: var(--c); color: #fff; }
.tchip.on .lt, .tchip.on .cnt { color: #fff; }
.tchip.dimmed { opacity: .5; }

/* ---- panes ---- */
main { flex: 1; min-height: 0; display: flex; }
#listPane { width: 38%; min-width: 340px; overflow: auto; background: #fff; border-right: 1px solid var(--line); overflow-anchor: none; position: relative; }
#detail { flex: 1; min-width: 0; overflow: auto; padding: 10px 16px 60px; overflow-anchor: none; }
.pillwrap { position: sticky; top: 0; height: 0; z-index: 3; text-align: center; }
#newPill { margin-top: 6px; border: 0; border-radius: 14px; background: #1d4ed8; color: #fff; padding: 3px 12px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.empty { color: var(--muted); padding: 30px; text-align: center; }

/* ---- rows ---- */
.row { padding: 4px 10px 5px 8px; border-bottom: 1px solid #f1f5f9; border-left: 4px solid transparent; cursor: pointer; }
.row:hover { background: #f8fafc; }
.row.sel { background: #e0e7ff; }
.row.dim { opacity: .55; }
.row.dim.sel { opacity: .85; }
.row.err { border-left-color: #dc2626; }
.row.toolerr { border-left-color: #f59e0b; }
.row.warn { border-left-color: #fbbf24; border-left-style: dashed; }
.l1 { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; }
.l1 .rid { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 30px; }
.l1 .tm, .l1 .dur { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.l1 .model { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.l1 .dur { margin-left: auto; }
.kind { font-size: 11px; color: #4b5563; background: #f3f4f6; border-radius: 3px; padding: 0 5px; white-space: nowrap; }
.tl { display: inline-block; min-width: 18px; text-align: center; color: #fff; font-weight: 700; font-size: 11px; border-radius: 3px; padding: 0 4px; }
.tl.none { background: #e5e7eb; color: #9ca3af; }
.l2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: #374151; margin-top: 1px; padding-left: 37px; }
.l2 > * { margin-right: 6px; }
.l2 .nmsg { color: var(--muted); }
.l2 .arrow { color: #9ca3af; }
.l2 .otok { color: var(--muted); }
.l2 .sugg { color: #6b7280; }
.l2 .errtxt { color: #b91c1c; }
.chip { display: inline-block; font-size: 11px; border-radius: 3px; padding: 0 5px; }
.chip.amber { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
.chip.tool { background: var(--call-bg); color: #9a3412; border: 1px solid #fdba74; font-family: var(--mono); font-size: 11px; }

/* badges & spinners */
.badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 3px; padding: 0 5px; min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; }
.badge.green { background: #dcfce7; color: #166534; }
.badge.red { background: #fee2e2; color: #991b1b; }
.badge.pending { background: #f3f4f6; }
.badge.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
.tchip.on .spin { border-color: rgba(255,255,255,.4); border-top-color: #fff; }

/* ---- detail ---- */
.summary { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; }
.summary .sl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 2px 0; }
.summary .sl .k { color: var(--muted); }
.summary .big { font-size: 15px; font-weight: 700; }
.summary .num { font-variant-numeric: tabular-nums; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; }
.panel > .phead { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; user-select: none; font-weight: 600; }
.panel > .phead::before { content: "▸"; color: var(--muted); width: 10px; }
.panel.open > .phead::before { content: "▾"; }
.panel > .pbody { padding: 4px 10px 10px; border-top: 1px solid #f1f5f9; }
.panel:not(.open) > .pbody { display: none; }
.panel .panel { margin: 6px 0; }
.panel .panel > .phead { font-weight: 500; padding: 4px 8px; }
.pb { font-size: 11px; font-weight: 500; border-radius: 3px; padding: 0 6px; background: #f3f4f6; color: #4b5563; }
.pb.chg { background: #fef3c7; color: #92400e; }
.pb.add { background: #dcfce7; color: #166534; }
.pb.del { background: #fee2e2; color: #991b1b; }
.pb.cache { background: #e0f2fe; color: #075985; }
.pb.warnb { background: #fef3c7; color: #92400e; }
.warnbox { background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; border-radius: 4px; padding: 4px 8px; margin: 4px 0; }
.errbox { background: var(--rerr-bg); border: 1px solid #fca5a5; border-left: 4px solid var(--rerr); color: #991b1b; border-radius: 4px; padding: 6px 10px; margin: 4px 0; }
.errbox .et { font-weight: 700; }
.note { color: var(--muted); font-style: italic; margin: 4px 0; }

/* messages & cards */
.msg { margin: 8px 0 10px; }
.msg.role-assistant { margin-left: 24px; }
.mhead { font-size: 11px; color: var(--muted); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.mhead b { color: #374151; }
.card { --c: var(--unk); --bg: #fff; border-left: 4px solid var(--c); background: var(--bg); border-radius: 4px; margin: 4px 0; padding: 4px 9px 6px; min-width: 0; }
.card.hl { outline: 2px solid var(--c); outline-offset: 1px; }
.chead { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.chead.click { cursor: pointer; user-select: none; }
.icon { color: var(--c); width: 14px; text-align: center; flex: none; }
.clabel { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c); white-space: nowrap; flex: none; }
.cdesc { color: #374151; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.cprev { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.cmeta { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; flex: none; }
.cid { color: #9ca3af; font-size: 10.5px; margin-left: auto; white-space: nowrap; }
.ftog { color: var(--muted); width: 10px; flex: none; }
.cbody { margin-top: 3px; min-width: 0; }
.k-you { --c: var(--you); --bg: var(--you-bg); }
.k-inj { --c: var(--inj); --bg: var(--inj-bg); }
.k-inj .clabel { color: #6b7280; }
.k-sys { --c: var(--sys); --bg: var(--sys-bg); }
.k-add { --c: #6b7280; --bg: #fff; }
.k-model { --c: var(--model); --bg: var(--model-bg); }
.k-think { --c: var(--think); --bg: var(--think-bg); }
.k-think .cbody { font-style: italic; }
.k-call { --c: var(--call); --bg: var(--call-bg); }
.k-res { --c: var(--res); --bg: var(--res-bg); }
.k-rerr { --c: var(--rerr); --bg: var(--rerr-bg); }
.k-unk { --c: var(--unk); --bg: #fff; }
.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(255,255,255,.7); border: 1px solid #fed7aa; border-radius: 3px; padding: 1px 6px; }
.sub { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: lowercase; }
.attached { margin: -2px 0 6px 18px; }
.waiting { color: var(--muted); font-style: italic; padding: 3px 0 3px 8px; border-left: 4px dashed #99f6e4; }
.stub { color: var(--res); font-size: 12px; padding: 2px 8px; border-left: 4px solid #99f6e4; margin: 4px 0; background: #fff; }
.loaded { font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--res); background: #fff; border: 1px solid #99f6e4; display: inline-block; padding: 1px 6px; border-radius: 3px; margin: 2px 0; }
.callwrap { margin: 4px 0; }

/* long text */
.txt { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
.txt.mono { font-family: var(--mono); font-size: 12px; }
.txt.clamp { max-height: calc(15 * 1.45em); overflow: hidden; -webkit-mask-image: linear-gradient(#000 75%, transparent); mask-image: linear-gradient(#000 75%, transparent); }
.ltbar { display: flex; gap: 10px; margin-top: 2px; }
.link { background: none; border: 0; padding: 0; color: #2563eb; cursor: pointer; font-size: 12px; }
.link:hover { text-decoration: underline; }
.grp { display: block; width: 100%; text-align: left; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 4px; padding: 4px 10px; color: #475569; cursor: pointer; margin: 6px 0; }

/* JSON tree */
.jt { font-family: var(--mono); font-size: 12px; line-height: 1.5; }
.jhead { cursor: pointer; user-select: none; }
.jtog { color: var(--muted); display: inline-block; width: 12px; }
.jkids { padding-left: 14px; border-left: 1px dotted #d1d5db; margin-left: 5px; }
.jk { color: #6b7280; }
.js { color: #047857; white-space: pre-wrap; word-break: break-word; }
.jn { color: #1d4ed8; }
.jb { color: #9333ea; }
.jnull { color: #9ca3af; }
.jsum { color: #9ca3af; }
.jrow.leaf { padding-left: 12px; }
.jchg { background: #fef3c7; border-radius: 2px; }

/* tools list */
.toolrow .chead .tn { font-weight: 700; font-family: var(--mono); font-size: 12px; flex: none; }
.tag { font-size: 10.5px; border-radius: 3px; padding: 0 5px; background: #f3f4f6; color: #4b5563; flex: none; }
.tag.def { background: #ede9fe; color: #5b21b6; }

/* headers table & diff */
table.hdrs { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; }
table.hdrs td { border-bottom: 1px solid #f1f5f9; padding: 2px 6px; vertical-align: top; word-break: break-all; }
table.hdrs td:first-child { color: var(--muted); white-space: nowrap; width: 1%; }
.diff { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.diff .da { background: #dcfce7; color: #14532d; }
.diff .dd { background: #fee2e2; color: #7f1d1d; }
.diff .dc { color: #6b7280; }
.diff .ds { color: #9ca3af; font-style: italic; }
h4 { margin: 8px 0 4px; font-size: 12px; color: #374151; }
</style>
</head>
<body>
<header id="top">
  <div class="bar1">
    <span id="live" class="off"><span class="dot"></span><span id="liveText">connecting…</span></span>
    <span class="brand">Agent traffic</span>
    <span id="totals"></span>
    <span class="controls">
      <select id="toolFilter" title="Show only exchanges involving this tool"><option value="">all tools</option></select>
      <label><input type="checkbox" id="errorsOnly"> Errors only</label>
      <label><input type="checkbox" id="hideSide"> Hide side calls</label>
      <label><input type="checkbox" id="follow" checked> Follow newest</label>
    </span>
  </div>
  <div id="chips"></div>
</header>
<main>
  <section id="listPane">
    <div class="pillwrap"><button id="newPill" hidden></button></div>
    <div id="list"></div>
  </section>
  <section id="detail"></section>
</main>
<script>
'use strict';
// All data reaches the DOM through createElement/textContent (never innerHTML).

const $ = (id) => document.getElementById(id);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}

const PALETTE = ['#2563eb', '#0d9488', '#d97706', '#db2777', '#475569']; // blue, teal, amber, pink, slate
const PAGE_CAP = 500;

// ---------------------------------------------------------------- state
let S;                       // everything rebuilt on `reset`
const ui = new Map();        // open/closed state of every toggle, by stable key
const rows = new Map();      // exchange id -> row element
const F = { thread: null, tool: '', errorsOnly: false, hideSide: false, follow: true };
let D = { id: null, waiting: new Set(), force: false };
let timer = null, lastRender = 0;

function fresh() {
  S = {
    ex: new Map(), threads: new Map(), threadList: [], sessThreads: new Map(),
    tools: new Map(), toolNames: new Set(), selected: null,
    dirty: new Set(), added: new Set(), changedTools: new Set(), all: true, newCount: 0,
  };
  rows.clear();
  $('list').textContent = '';
  D = { id: null, waiting: new Set(), force: true };
}
const uiGet = (k, d) => (ui.has(k) ? ui.get(k) : d);

// ---------------------------------------------------------------- helpers
function hdr(list, name) {
  name = name.toLowerCase();
  for (const p of list || []) if (Array.isArray(p) && String(p[0]).toLowerCase() === name) return String(p[1]);
  return null;
}
function normContent(c) {
  if (typeof c === 'string') return [{ type: 'text', text: c }];
  if (Array.isArray(c)) return c;
  if (c == null) return [];
  return [c];
}
function stripCC(v) {
  if (Array.isArray(v)) return v.map(stripCC);
  if (v && typeof v === 'object') {
    const o = {};
    for (const k of Object.keys(v).sort()) if (k !== 'cache_control') o[k] = stripCC(v[k]);
    return o;
  }
  return v;
}
const stable = (v) => JSON.stringify(stripCC(v));
function normStr(m) {
  if (!m || typeof m !== 'object') return JSON.stringify(m);
  return stable(Object.assign({}, m, { content: normContent(m.content) }));
}
function normHash(m) {
  const s = normStr(m);
  let x = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); }
  return s.length + ':' + (x >>> 0).toString(36);
}
const oneLine = (s) => String(s).replace(/\r?\n/g, ' ⏎ ').replace(/\s+/g, ' ').trim();
const firstLine = (s) => String(s || '').split('\n').find((l) => l.trim()) || '';
const isInjected = (t) => /^\s*(<system-reminder>|\[SUGGESTION MODE:)/.test(t);
const pad2 = (n) => String(n).padStart(2, '0');
function hms(t) { const d = new Date(t); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }
function fmtMs(ms) {
  if (ms == null || !isFinite(ms)) return '–';
  if (ms < 1000) return Math.round(ms) + ' ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + ' s';
  return Math.floor(ms / 60000) + 'm' + pad2(Math.round((ms % 60000) / 1000)) + 's';
}
function fmtN(n) {
  n = +n || 0;
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1000).toFixed(n < 10000 ? 1 : 0) + 'k';
  return (n / 1e6).toFixed(2) + 'M';
}
const fmtInt = (n) => (+n || 0).toLocaleString('en-US');
const pb = (text, cls) => h('span', { class: 'pb' + (cls ? ' ' + cls : ''), text });

// ---------------------------------------------------------------- classification & threads
function classify(ex) {
  const b = ex.b;
  if (ex.method !== 'POST' || !ex.path.startsWith('/v1/messages')) return ['probe', 'probe'];
  if (!b) return ['side', 'side'];
  if (b.max_tokens === 1) return ['probe', 'probe: quota'];
  if (isSuggestion(b)) return ['side', 'side: suggestion'];
  if (!Array.isArray(b.tools) || b.tools.length === 0) {
    const props = b.output_config && b.output_config.format && b.output_config.format.schema && b.output_config.format.schema.properties;
    const name = props && typeof props === 'object' ? Object.keys(props)[0] : null;
    return ['side', name ? 'side: ' + name : 'side'];
  }
  return ['main', ''];
}
function isSuggestion(b) {
  const ms = Array.isArray(b.messages) ? b.messages : [];
  const last = ms[ms.length - 1];
  if (!last || last.role !== 'user') return false;
  const texts = normContent(last.content).filter((x) => x && x.type === 'text');
  const lt = texts[texts.length - 1];
  return !!lt && typeof lt.text === 'string' && lt.text.trimStart().startsWith('[SUGGESTION MODE:');
}
function threadKey(ex) {
  const b = ex.b;
  let sys = '';
  if (typeof b.system === 'string') sys = b.system;
  else if (Array.isArray(b.system) && b.system.length) {
    const l = b.system[b.system.length - 1];
    sys = typeof l === 'string' ? l : String((l && l.text) || '');
  }
  const fu = ex.msgs.find((m) => m && m.role === 'user');
  return ex.session + '␞' + sys.slice(0, 300) + '␞' + (fu ? normStr(fu).slice(0, 300) : '');
}
function firstPrompt(ex) {
  const fu = ex.msgs.find((m) => m && m.role === 'user');
  if (!fu) return '';
  for (const b of normContent(fu.content)) if (b && b.type === 'text' && typeof b.text === 'string' && !isInjected(b.text)) return oneLine(b.text);
  return '';
}
function letterFor(i) { let s = ''; i++; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }
function newThread(ex) {
  const i = S.threadList.length;
  const t = { key: ex.threadKey, letter: letterFor(i), color: PALETTE[i % PALETTE.length], session: ex.session, prompt: firstPrompt(ex), mains: [] };
  S.threads.set(t.key, t);
  S.threadList.push(t);
  if (!S.sessThreads.has(ex.session)) S.sessThreads.set(ex.session, []);
  S.sessThreads.get(ex.session).push(t);
  for (const o of S.ex.values()) if (o.session === ex.session && o.kind !== 'main') S.dirty.add(o.id); // side calls may now belong here
  return t;
}
function threadOf(ex) {
  if (ex.kind === 'main') return ex.thread;
  if (!ex.b) return null;
  return S.threads.get(ex.threadKey) || (S.sessThreads.get(ex.session) || [])[0] || null;
}

// ---------------------------------------------------------------- "new this turn"
function computeNew(ex, P) {
  const ms = ex.msgs;
  if (P) {
    const a = P.nk, b = ex.nk;
    let L = 0;
    while (L < a.length && L < b.length && a[L] === b[L]) L++;
    return { start: L, changedAt: L < a.length ? L : -1, prevId: P.id };
  }
  let i = -1;
  for (let k = ms.length - 1; k >= 0; k--) if (ms[k] && ms[k].role === 'user') { i = k; break; }

  if (errs.length && ex.kind === 'probe') out.push(h('div', { class: 'note', text: 'expected for a probe: not counted as an error' }));
  if (r.blocks.length) {
    const wrap = h('div', { class: 'msg role-assistant' }, h('div', { class: 'mhead' }, h('b', { text: 'reply' }), ' · assistant' + (r.msgId ? ' · ' + r.msgId : '')));
    r.blocks.forEach((b, i) => { if (b) wrap.append(blockCard(ctx, b, 'assistant', `${key}/b${i}`, false)); });
    out.push(wrap);
  } else if (ex.jsonReply && ex.jsonReply.type !== 'error') out.push(jsonTree(key + ':json', ex.jsonReply));
  else if (ex.isSSE === false && ex.raw && !ex.jsonReply && !(ex.status >= 400)) out.push(longText(key + ':text', ex.raw, 'mono'));
  if (r.bad && r.bad.length) out.push(h('div', { class: 'warnbox', text: `⚠ ${r.bad.length} SSE event(s) could not be parsed (see Raw)` }));
  if (ex.endT == null) out.push(h('div', { class: 'note' }, h('span', { class: 'spin' }), ex.status == null ? ' waiting for response…' : ' streaming…'));
  else if (!r.blocks.length && !ex.raw && !errs.length) out.push(h('div', { class: 'note', text: '(no body)' }));
  return out;
}
function convMaps(ms) {
  const callIdx = new Map(), convRes = new Map();
  ms.forEach((m, i) => normContent(m && m.content).forEach((b) => {
    if (b && b.type === 'tool_use' && b.id) callIdx.set(b.id, i);
    if (b && b.type === 'tool_result' && b.tool_use_id && !convRes.has(b.tool_use_id)) convRes.set(b.tool_use_id, b);
  }));
  return { callIdx, convRes };
}
function convPanel(ex) {
  const key = `x${ex.id}:conv`;
  const ms = ex.msgs;
  return panel(key, `Conversation (${ms.length} messages)`, [], true, () => {
    const start = ex.nw.start;
    const gk = key + ':earlier';
    const expanded = uiGet(gk, false);
    const from = expanded ? 0 : start;
    const ctx = { ex, mode: 'conv', renderedFrom: from, ...convMaps(ms) };
    const out = [];
    if (start > 0) out.push(h('button', { class: 'grp', onclick: () => { ui.set(gk, !expanded); D.force = true; render(); } },
      `${expanded ? '▾' : '▸'} ${start} earlier message${start === 1 ? '' : 's'}` + (ex.nw.prevId != null ? ` (already in #${ex.nw.prevId})` : '')));
    for (let i = from; i < ms.length; i++) out.push(messageCard(ctx, ms[i], i, key));
    return out;
  });
}
function systemPanel(ex) {
  const key = `x${ex.id}:sys`;
  const blocks = sysBlocks(ex.b);
  const chars = blocks.reduce((a, b) => a + b.text.length, 0);
  const d = diffs(ex);
  return panel(key, 'System instructions', [pb(`${blocks.length} block${blocks.length === 1 ? '' : 's'} · ${fmtInt(chars)} chars`),
    d ? pb(d.sysChanged ? 'changed' : 'unchanged', d.sysChanged ? 'chg' : '') : null], false, () => {
    const out = [];
    if (d && d.sysChanged) {
      const join = (arr) => arr.map((t, i) => `──── block ${i + 1} ────\n${t}`).join('\n');
      out.push(panel(key + ':diff', `Diff vs #${d.prevId}`, [], true, () => diffView(join(d.sysPrev), join(d.sysCur))));
    }
    blocks.forEach((b, i) => out.push(panel(`${key}:${i}`, `Block ${i + 1}`, [pb(fmtInt(b.text.length) + ' chars'), b.cc ? pb('cache', 'cache') : null], true,
      () => [h('div', { class: 'txt mono', text: b.text }), h('div', { class: 'ltbar' }, copyBtn(b.text))])));
    return out;
  });
}
function toolsPanel(ex) {
  const key = `x${ex.id}:tools`;
  const tools = ex.b.tools;
  const d = diffs(ex);
  return panel(key, `Tools (${tools.length})`, d ? toolsBadge(d) : [], false, () => {
    const out = [];
    tools.forEach((t, i) => {
      if (!t || typeof t !== 'object') { out.push(unknownCard(`${key}:${i}`, 'tool', t)); return; }
      const name = String(t.name == null ? '?' : t.name);
      const tags = [];
      if (t.defer_loading) tags.push(h('span', { class: 'tag def', text: 'deferred' }));
      if (d && d.added.includes(name)) tags.push(pb('added', 'add'));
      if (d && d.changed.includes(name)) tags.push(pb('changed', 'chg'));
      const row = foldCard('k-unk toolrow', '', '', `${key}:${i}`, firstLine(t.description), () => [
        t.description ? longText(`${key}:${i}:d`, String(t.description)) : null,
        h('div', { class: 'sub', text: 'input_schema' }), jsonTree(`${key}:${i}:s`, t.input_schema === undefined ? null : t.input_schema),
      ], false, tags);
      const head = row.firstChild;
      head.insertBefore(h('span', { class: 'tn', text: name }), head.querySelector('.cprev'));
      out.push(row);
    });
    if (d) d.removed.forEach((n) => out.push(h('div', { class: 'note' }, pb('removed', 'del'), ' ' + n)));
    return out;
  });
}
function paramsPanel(ex) {
  const key = `x${ex.id}:params`;
  const params = {};
  for (const k of Object.keys(ex.b)) if (!['messages', 'system', 'tools'].includes(k)) params[k] = ex.b[k];
  const d = diffs(ex);
  return panel(key, 'Request parameters', [d ? (d.params.length ? d.params.map((k) => pb(k + ' changed', 'chg')) : pb('unchanged')) : null], false,
    () => jsonTree(key + ':t', params, { hl: new Set(d ? d.allChanged : []) }));
}
function headersPanel(ex) {
  const key = `x${ex.id}:hdrs`;
  const table = (list) => list.length ? h('table', { class: 'hdrs' }, list.map((p) => h('tr', null, h('td', { text: String(p[0]) }), h('td', { text: String(p[1]) }))))
    : h('div', { class: 'note', text: '(none)' });
  return panel(key, 'Headers', [pb(`${ex.headers.length} request · ${ex.respHeaders.length} response`)], false, () => [
    h('h4', { text: 'Request headers' }), table(ex.headers), h('h4', { text: 'Response headers' }), table(ex.respHeaders)]);
}
function rawPanel(ex) {
  const key = `x${ex.id}:raw`;
  return panel(key, 'Raw', [pb(`response ${fmtInt(ex.raw.length)} chars`)], false, () => [
    h('h4', { text: 'Request body' }),
    ex.bj != null ? jsonTree(key + ':req', ex.bj) : ex.body ? longText(key + ':reqt', ex.body, 'mono') : h('div', { class: 'note', text: '(no body)' }),
    h('h4', { text: 'Response text' }),
    ex.raw ? longText(key + ':resp', ex.raw, 'mono') : h('div', { class: 'note', text: '(no body)' })]);
}

// ---------------------------------------------------------------- wiring
function setLive(on) {
  $('live').className = on ? 'on' : 'off';
  $('liveText').textContent = on ? 'live' : 'reconnecting…';
}
let es = null;
function connect() {
  if (es) es.close();
  es = new EventSource('/__events');
  es.onopen = () => setLive(true);
  es.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } try { handle(m); } catch (err) { console.error(err); } };
  es.onerror = () => { setLive(false); if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2000); };
}
$('toolFilter').addEventListener('change', (e) => { F.tool = e.target.value; filtersChanged(); });
$('errorsOnly').addEventListener('change', (e) => { F.errorsOnly = e.target.checked; filtersChanged(); });
$('hideSide').addEventListener('change', (e) => { F.hideSide = e.target.checked; filtersChanged(); });
$('follow').addEventListener('change', (e) => { F.follow = e.target.checked; if (F.follow) { S.selected = null; $('listPane').scrollTop = 0; S.newCount = 0; } render(); });
$('newPill').addEventListener('click', () => { $('listPane').scrollTop = 0; S.newCount = 0; render(); });
$('listPane').addEventListener('scroll', () => { if ($('listPane').scrollTop < 5 && S.newCount) { S.newCount = 0; schedule(); } });
setInterval(() => { // keep durations of pending exchanges ticking
  let any = false;
  for (const ex of S.ex.values()) if (ex.endT == null) { S.dirty.add(ex.id); any = true; }
  if (any) schedule();
}, 1000);
fresh();
render();
connect();
</script>
